name: Portfolio quality

on:
  push:
    branches: [main]
    paths-ignore:
      - "public/images/portraits/**"

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Optimize portraits
        run: npm run assets:optimize

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit optimized portraits
        run: |
          if git diff --quiet -- public/images/portraits; then
            echo "No optimized portrait changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/portraits
          git commit -m "chore: generate optimized portrait assets"
          git push
